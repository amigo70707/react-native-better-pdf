# ref.getPageSizes() on the `page-boxes` fixtures: inherited media box,
# rotation (90, 270, 180, -90), crop box, offset origin and a crop box
# clipped to the media box. Android reads the plain file's page tree and
# measures the encrypted one with the renderer; both must agree with iOS.
appId: software.gmi.betterpdf.example
env:
  SIZES: "sizes 7: 612x792 842x595 500x600 792x400 300x400 595x842 500x300 \\(.*"
---
- launchApp: { stopApp: true }
- runFlow: _dismiss-dev-menu.yaml
- tapOn: "Viewer"
- scrollUntilVisible: { element: "page-boxes(, .*)?", centerElement: true }
- tapOn: "page-boxes(, .*)?"
- extendedWaitUntil: { visible: "1 / 7", timeout: 15000 }
- tapOn: "Sizes"
- extendedWaitUntil: { visible: "${SIZES}", timeout: 10000 }
- tapOn: "‹ Back"

- scrollUntilVisible: { element: "page-boxes-encrypted(, .*)?", centerElement: true }
- tapOn: "page-boxes-encrypted(, .*)?"
- tapOn: "Try fixture"
- extendedWaitUntil: { visible: "1 / 7", timeout: 15000 }
- tapOn: "Sizes"
- extendedWaitUntil: { visible: "${SIZES}", timeout: 10000 }
- tapOn: "‹ Back"
