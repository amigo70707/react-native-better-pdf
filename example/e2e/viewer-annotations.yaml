# Loads the `annotations` fixture (one annotation of each kind) and takes a
# screenshot for review against docs/api-design.md "Annotations" — which
# kinds render is a pixel question Maestro cannot assert.
appId: software.gmi.betterpdf.example
---
- launchApp: { stopApp: true }
- runFlow: _dismiss-dev-menu.yaml
- tapOn: "Viewer"
- scrollUntilVisible: { element: "annotations.*", centerElement: true }
- tapOn: "annotations.*"
- extendedWaitUntil: { visible: "1 / 1", timeout: 15000 }
- waitForAnimationToEnd
- takeScreenshot: annotations
- tapOn: "‹ Back"
